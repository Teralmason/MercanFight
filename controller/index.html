<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MercanFight Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body { background: #07070a; color: white; font-family: system-ui, sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        
        .login-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 12px; }
        input { padding: 14px; border-radius: 8px; border: 2px solid #222230; width: 65%; background: #12121a; color: white; text-align: center; font-size: 16px; }
        .btn-join { background: #ff5500; color: white; font-weight: bold; padding: 16px 50px; border-radius: 10px; border: none; font-size: 18px; cursor: pointer; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255,85,0,0.3);}
        
        #gamepad { display: none; height: 100vh; width: 100vw; position: relative; background: #050508; }
        
        /* Taşınabilir Alanlar */
        #joystick-zone { position: absolute; left: 5%; top: 35%; width: 200px; height: 200px; z-index: 10; touch-action: none; }
        #action-zone { position: absolute; right: 5%; bottom: 10%; width: 280px; height: 220px; z-index: 10; touch-action: none; }
        
        /* Düzenleme Modu Görsel Yardımı */
        .edit-mode .draggable-zone {
            outline: 2px dashed #ff5500;
            background: rgba(255, 85, 0, 0.1) !important;
        }

        .action-btn { 
            width: 95px; height: 95px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 15px; border: 4px solid rgba(255,255,255,0.08);
            user-select: none; -webkit-user-select: none;
            color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            position: absolute;
        }
        .action-btn:active { transform: scale(0.85); filter: brightness(1.3); }

        /* Butonların Başlangıç İç Pozisyonları */
        #btn-punch { background: linear-gradient(135deg, #ff1a4a, #ff4b2b); bottom: 10px; left: 10px; }
        #btn-kick { background: linear-gradient(135deg, #f7971e, #e2b000); color: black; bottom: 10px; right: 10px; }
        #btn-jump { background: linear-gradient(135deg, #00b4db, #006699); top: 10px; left: 50%; transform: translateX(-50%); width: 85px; height: 85px; }

        /* Düzenleme Arayüzü Butonu */
        #layout-edit-btn {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: #161622; color: #ff5500; border: 1px solid #ff5500;
            padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 13px;
            cursor: pointer; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }
        #layout-edit-btn.active { background: #ff5500; color: white; }
    </style>
</head>
<body>
    <div id="login" class="login-box">
        <h2 style="color:#ff5500; margin:0; letter-spacing: 2px;">MercanFight Controller</h2>
        <p style="font-size: 13px; color: #52556a;">Telefonu yatay tut ve odaya bağlan</p>
        <input type="text" id="nick" placeholder="SAVAŞÇI ADI">
        <input type="number" id="room" placeholder="ODA KODU">
        <button class="btn-join" onclick="initAndJoin()">DÖVÜŞE KATIL</button>
    </div>

    <div id="gamepad">
        <button id="layout-edit-btn" onclick="toggleLayoutEdit()">Düzeni Düzenle</button>
        
        <!-- Sürüklenip taşınabilen ana joystick bölgesi -->
        <div id="joystick-zone" class="draggable-zone"></div>
        
        <!-- Sürüklenip taşınabilen ana sağ buton paneli -->
        <div id="action-zone" class="draggable-zone">
            <div class="action-btn" id="btn-jump">ZIPLA</div>
            <div class="action-btn" id="btn-punch">YUMRUK</div>
            <div class="action-btn" id="btn-kick">TEKME</div>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let conn;
        let joystickVector = { x: 0 }; 
        let sendTicker = null;         
        let isEditMode = false;
        let manager = null; // NippleJS instance'ı sıfırlayıp kurmak için taşıyıcı

        // Hafızadaki buton konumlarını yükle
        applySavedLayout();

        async function initAndJoin() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(e => console.log(e));
                }
            } catch (err) { console.log(err); }
            joinGame();
        }

        function joinGame() {
            const nick = document.getElementById('nick').value || "JellyNinja";
            const room = document.getElementById('room').value;
            
            if(!room) { alert("Oda kodu boş olamaz."); return; }

            conn = peer.connect("shadow-" + room);
            conn.on('open', () => {
                document.getElementById('login').style.display = 'none';
                document.getElementById('gamepad').style.display = 'block';
                conn.send({ type: 'join', nick: nick });
                setupGamepad();
                setupDraggableElements(); // Sürükleme mekanizmasını bağla
                startSendTicker(); 
            });

            conn.on('error', err => alert("Bağlantı koptu: " + err));
        }

        function startSendTicker() {
            sendTicker = setInterval(() => {
                if (conn && conn.open && !isEditMode) {
                    conn.send({ type: 'move', x: joystickVector.x });
                }
            }, 16);
        }

        function setupGamepad() {
            // Eğer daha önceden kurulmuş bir joystick varsa temizle
            if(manager) { manager.destroy(); }

            manager = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static', 
                position: { left: '50%', top: '50%' }, // Taşınan kutunun tam merkezine oturt
                color: '#ff5500', 
                size: 120
            });

            manager.on('move', (e, d) => {
                if (isEditMode) return;
                if (d.vector) joystickVector.x = d.vector.x;
            }).on('end', () => {
                joystickVector.x = 0;
            });

            const punchBtn = document.getElementById('btn-punch');
            const kickBtn = document.getElementById('btn-kick');
            const jumpBtn = document.getElementById('btn-jump');

            const sendAction = (actionName) => {
                if(isEditMode) return; // Düzenleme modunda vurmayı engelle
                if(conn && conn.open) conn.send({ type: 'action', value: actionName });
            };

            // Mobil Dokunmatik Eventler
            punchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendAction('punching'); });
            kickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendAction('kicking'); });
            jumpBtn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if(conn && conn.open && !isEditMode) conn.send({ type: 'jump' }); 
            });

            // PC Mouse Test Eventleri
            punchBtn.addEventListener('mousedown', () => sendAction('punching'));
            kickBtn.addEventListener('mousedown', () => sendAction('kicking'));
            jumpBtn.addEventListener('mousedown', () => { if(conn && !isEditMode) conn.send({ type: 'jump' }); });
        }

        // ==========================================
        // DÜZENLEME VE SÜRÜKLE BIRAK SİSTEMİ
        // ==========================================
        
        function toggleLayoutEdit() {
            const btn = document.getElementById('layout-edit-btn');
            isEditMode = !isEditMode;
            
            if (isEditMode) {
                document.getElementById('gamepad').classList.add('edit-mode');
                btn.innerText = "Düzeni Kaydet";
                btn.classList.add('active');
            } else {
                document.getElementById('gamepad').classList.remove('edit-mode');
                btn.innerText = "Düzeni Düzenle";
                btn.classList.remove('active');
                
                // Yeni konumları hafızaya kaydet
                const joy = document.getElementById('joystick-zone');
                const act = document.getElementById('action-zone');
                
                localStorage.setItem('joy_left', joy.style.left);
                localStorage.setItem('joy_top', joy.style.top);
                localStorage.setItem('act_right', act.style.right);
                localStorage.setItem('act_bottom', act.style.bottom);
                
                // Joystick'i yeni merkez noktasına göre yeniden kalibre et
                setupGamepad();
            }
        }

        function applySavedLayout() {
            // Sayfa açıldığında eski konumlar varsa uygula
            const jLeft = localStorage.getItem('joy_left');
            const jTop = localStorage.getItem('joy_top');
            const aRight = localStorage.getItem('act_right');
            const aBottom = localStorage.getItem('act_bottom');

            if (jLeft && jTop) {
                const joy = document.getElementById('joystick-zone');
                joy.style.left = jLeft;
                joy.style.top = jTop;
            }
            if (aRight && aBottom) {
                const act = document.getElementById('action-zone');
                act.style.right = aRight;
                act.style.bottom = aBottom;
                act.style.left = 'auto'; // Flex çakışmasını önle
                act.style.top = 'auto';
            }
        }

        function setupDraggableElements() {
            const targets = [document.getElementById('joystick-zone'), document.getElementById('action-zone')];
            
            targets.forEach(el => {
                let isDragging = false;
                let startX, startY, initialLeft, initialTop, initialRight, initialBottom;

                const startDrag = (e) => {
                    if (!isEditMode) return;
                    isDragging = true;
                    
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    startX = clientX;
                    startY = clientY;
                    
                    const rect = el.getBoundingClientRect();
                    initialLeft = rect.left;
                    initialTop = rect.top;
                    
                    // Sağ panel için sağ-alt tabanlı kaydırma hesaplaması
                    initialRight = window.innerWidth - rect.right;
                    initialBottom = window.innerHeight - rect.bottom;
                };

                const doDrag = (e) => {
                    if (!isDragging) return;
                    
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    const dx = clientX - startX;
                    const dy = clientY - startY;

                    if (el.id === 'joystick-zone') {
                        // Sol paneli sol ve üst koordinatlara göre taşı
                        el.style.left = (initialLeft + dx) + 'px';
                        el.style.top = (initialTop + dy) + 'px';
                    } else {
                        // Sağ paneli sağ ve alt kenara kitleyerek taşı (Responsive kalması için)
                        el.style.right = (initialRight - dx) + 'px';
                        el.style.bottom = (initialBottom - dy) + 'px';
                        el.style.left = 'auto';
                        el.style.top = 'auto';
                    }
                };

                const endDrag = () => { isDragging = false; };

                // Dokunmatik Ekran Dinleyicileri
                el.addEventListener('touchstart', startDrag);
                window.addEventListener('touchmove', doDrag, { passive: false });
                window.addEventListener('touchend', endDrag);

                // Bilgisayarda Test Etmek İçin Mouse Dinleyicileri
                el.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', doDrag);
                window.addEventListener('mouseup', endDrag);
            });
        }
    </script>
</body>
</html>
